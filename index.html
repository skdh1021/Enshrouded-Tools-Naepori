<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>인슈라오디드 도구함</title>
<style>
:root{--bg:#eef0f3;--sf:#fff;--ink:#1b1f27;--mut:#5d6573;--line:#d5d9e0;--ac:#374151;--acf:#fff;color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#12141a;--sf:#1b1e26;--ink:#e8eaf0;--mut:#98a0ae;--line:#2d323d;--ac:#e5e7eb;--acf:#12141a;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#12141a;--sf:#1b1e26;--ink:#e8eaf0;--mut:#98a0ae;--line:#2d323d;--ac:#e5e7eb;--acf:#12141a;color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{display:flex;flex-direction:column;background:var(--bg);color:var(--ink);font:15px/1.55 "Noto Sans KR",system-ui,-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif}
header{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:calc(env(safe-area-inset-top,0px) + 8px) 12px 8px;background:var(--sf);border-bottom:1px solid var(--line)}
.brand{font-weight:700;margin-right:auto;color:var(--ink);text-decoration:none}
.nav{display:flex;gap:6px}
.nav a{padding:7px 14px;border:1px solid var(--line);border-radius:8px;color:var(--ink);text-decoration:none;background:var(--sf)}
.nav a:hover{border-color:var(--ac)}
.nav a[aria-current=page]{background:var(--ac);border-color:var(--ac);color:var(--acf);font-weight:500}
a:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
main{flex:1;position:relative;min-height:0}
iframe{position:absolute;inset:0;width:100%;height:100%;border:0;background:var(--bg)}
iframe[hidden],#home[hidden]{display:none}
#home{height:100%;overflow:auto;padding:28px 14px calc(env(safe-area-inset-bottom,0px) + 28px)}
.in{max-width:760px;margin:0 auto}
h1{font-size:24px;margin:0 0 4px}.sub{color:var(--mut);margin:0 0 20px}
.cards{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media (max-width:620px){.cards{grid-template-columns:1fr}}
.pick{display:block;padding:20px;border:1px solid var(--line);border-radius:14px;background:var(--sf);color:var(--ink);text-decoration:none}
.pick:hover{border-color:var(--ac)}
.pick .ic{font-size:30px}.pick b{display:block;font-size:18px;margin:6px 0 4px}.pick span{color:var(--mut);font-size:14px}
</style>
</head>
<body>
<header>
  <a class="brand" href="#">인슈라오디드 도구함</a>
  <nav class="nav" aria-label="프로그램 전환">
    <a href="#armory" id="n-armory">⚔️ 무기고</a>
    <a href="#blueprint" id="n-blueprint">🛠️ 설계도</a>
  </nav>
</header>
<main id="stage">
  <section id="home">
    <div class="in">
      <h1>어떤 도구를 쓰시겠어요?</h1>
      <p class="sub">위쪽 버튼으로 언제든 바로 전환할 수 있어요. 각 도구에서 입력한 값은 전환해도 그대로 유지돼요.</p>
      <div class="cards">
        <a class="pick" href="#armory"><div class="ic">⚔️</div><b>인슈라오디드 무기고</b><span>무기·강화·스킬·보석·음식 세팅으로 DPS와 DPM을 계산하고, 세팅을 저장해서 비교해요.</span></a>
        <a class="pick" href="#blueprint"><div class="ic">🛠️</div><b>인슈라오디드 설계도</b><span>제작 트리와 필요한 재료 총량, 재료를 얻는 지역과 몬스터, 화염 제단 로드맵을 찾아봐요.</span></a>
      </div>
    </div>
  </section>
</main>
<script>
(function(){
var APPS={armory:{t:'인슈라오디드 무기고',src:'armory.html'},blueprint:{t:'인슈라오디드 설계도',src:'blueprint.html'}};
var frames={},stage=document.getElementById('stage'),home=document.getElementById('home');
function route(){
  var k=(location.hash||'').replace('#','');
  if(!APPS[k])k='';
  Object.keys(APPS).forEach(function(a){
    if(frames[a])frames[a].hidden=(a!==k);
    var n=document.getElementById('n-'+a);
    if(a===k)n.setAttribute('aria-current','page');else n.removeAttribute('aria-current');
  });
  if(k){
    if(!frames[k]){
      var f=document.createElement('iframe');
      f.src=APPS[k].src;f.title=APPS[k].t;f.setAttribute('allow','clipboard-write');
      stage.appendChild(f);frames[k]=f;
    }
    frames[k].hidden=false;home.hidden=true;document.title=APPS[k].t;
  }else{
    home.hidden=false;document.title='인슈라오디드 도구함';
  }
}
window.addEventListener('hashchange',route);
route();
})();
</script>
</body>
</html>
