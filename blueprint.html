<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>인슈라오디드 설계도</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap">
<style>
:root{--bg:#eef0f3;--sf:#fff;--ink:#1b1f27;--mut:#5d6573;--line:#d5d9e0;--ac:#374151;--acf:#fff;--lk:#1d4ed8;--star:#e0a800;--mtS:78%;--mtL:90%;--mtT:20%;--mtB:68%;--tintS:70%;--tintL:94%;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}

html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.55 "Noto Sans KR",system-ui,-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif}
.wrap{max-width:900px;margin:0 auto;padding:18px 14px 48px}
h1{font-size:22px;margin:0 0 2px}.sub{color:var(--mut);margin:0 0 14px}
h2{font-size:20px;margin:6px 0}h3{font-size:16px;margin:18px 0 8px}h4{font-size:14px;margin:16px 0 6px;color:var(--mut)}
input,select,button{font:inherit;color:var(--ink)}
input[type=search],input[type=number],select{width:100%;padding:9px 11px;background:var(--sf);border:1px solid var(--line);border-radius:8px}
input:focus-visible,select:focus-visible,button:focus-visible,a:focus-visible{outline:2px solid var(--ac);outline-offset:1px}
button{cursor:pointer;background:var(--sf);border:1px solid var(--line);border-radius:8px;padding:6px 12px}
button:hover:not(:disabled){border-color:var(--ac)}button:disabled{opacity:.45;cursor:default}
a{color:var(--lk)}
.sbox{position:relative}
#sug{position:absolute;left:0;right:0;top:100%;z-index:5;background:var(--sf);border:1px solid var(--line);border-radius:8px;margin-top:4px;max-height:320px;overflow:auto;display:none}
#sug button{display:flex;justify-content:space-between;align-items:center;width:100%;border:0;border-radius:0;text-align:left;padding:8px 12px;background:transparent}
#sug button:hover{background:var(--bg)}
#sug .fav{width:auto}
.tabs{display:flex;gap:6px;margin:12px 0}
.tabs button{flex:1}.tabs button[aria-pressed=true]{background:var(--ac);border-color:var(--ac);color:var(--acf)}
.card,.rc{background:var(--sf);border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin-bottom:10px}
.ch{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:space-between;margin-bottom:6px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{background:var(--sf);border:1px solid var(--line);border-radius:999px;padding:3px 11px;font-size:13.5px;color:var(--ink)}
/* 직업별 색: --sth 작업대 색상(hue), --mth 제작 재료 색상(hue) */
.j-smith{--sth:2;--stl:42%;--mth:332}.j-carp{--sth:26;--stl:40%;--mth:42}.j-farm{--sth:62;--stl:30%;--mth:84}.j-hunt{--sth:135;--stl:30%;--mth:160}
.j-coll{--sth:176;--stl:30%;--mth:194}.j-anc{--sth:208;--stl:40%;--mth:232}.j-alch{--sth:275;--stl:42%;--mth:302}.j-basic{--sth:215;--stl:42%;--mth:215;--satk:.08}
.c-st{background:hsl(var(--sth) calc(60% * var(--satk,1)) var(--stl,40%));color:#fff;border-color:hsl(var(--sth) calc(60% * var(--satk,1)) calc(var(--stl,40%) - 12%))}
.c-mt{background:hsl(var(--mth) calc(var(--mtS) * var(--satk,1)) var(--mtL));color:hsl(var(--mth) 55% var(--mtT));border-color:hsl(var(--mth) calc(var(--mtS) * var(--satk,1)) var(--mtB))}
.c-surv{background:#334155;color:#fff;border-color:#1e293b}

:root[data-theme="dark"] .c-surv{background:#475569;border-color:#64748b}
.c-raw{background:var(--sf);border:1px dashed var(--mut)}
.c-grp{background:transparent;border:1px dashed var(--lk)}
.hd{display:flex;flex-wrap:wrap;align-items:center;gap:10px;padding:10px 14px;border-radius:10px;margin:8px 0 4px;border:1px solid var(--line)}
.hd h2{margin:0}.hd a{color:inherit}.hd .tag{background:rgba(127,127,127,.28);color:inherit}.hd .fav{margin-left:auto}
.hd.c-raw{background:var(--sf)}
.rc{border-left:6px solid var(--line)}
.rc[class*="j-"]{border-left-color:hsl(var(--sth) calc(60% * var(--satk,1)) 45%)}
.tint{background:hsl(var(--sth) calc(var(--tintS) * var(--satk,1)) var(--tintL));border-left:6px solid hsl(var(--sth) calc(60% * var(--satk,1)) 45%)}
.fav{border:0;background:transparent;padding:0 5px;font-size:20px;line-height:1;color:var(--star)}
.fav[aria-pressed=false]{color:var(--mut)}
.favs{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin:10px 0 0}.favs:empty{display:none}.fl{font-size:13px;color:var(--star);font-weight:700}
.srow{display:flex;align-items:center;border-bottom:1px solid var(--line)}.srow>button:first-child{flex:1}.srow .fav{margin-right:6px}
.sw{display:inline-block;width:11px;height:11px;border-radius:3px;margin-right:8px;vertical-align:-1px;border:1px solid transparent}
.sh{padding:7px 12px;font-size:12.5px;color:var(--star);font-weight:700;background:var(--bg)}
.sh2{padding:6px 12px;font-size:12px;font-weight:500;color:var(--mut);background:var(--bg)}
.fam{border-left:3px solid var(--line);margin:6px 0 6px 6px;padding-left:14px}
.fr{display:grid;grid-template-columns:170px 1fr;gap:6px 12px;align-items:start;padding:8px 0;border-bottom:1px dashed var(--line);position:relative}
.fr:last-child{border-bottom:0}
.fr:before{content:"";position:absolute;left:-14px;top:20px;width:11px;border-top:3px solid var(--line)}
.fh{display:flex;flex-direction:column;gap:2px;align-items:flex-start}
@media (max-width:560px){.fr{grid-template-columns:1fr}}
.leg{margin:10px 0 0}.leg summary{cursor:pointer;color:var(--mut);font-size:13px}.lrow{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.tag{font-size:12px;font-weight:500;background:var(--bg);border-radius:999px;padding:1px 9px;color:var(--mut);vertical-align:middle}
.ln{margin:3px 0}small,.note{color:var(--mut);font-size:12.5px}
.top{display:flex;gap:8px;align-items:center;margin-bottom:4px}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin:8px 0}
.row input[type=number]{width:90px}
.tr,.tr ul{list-style:none;margin:0;padding-left:18px;border-left:1px dashed var(--line)}
.tr{padding-left:0;border:0}.tr li{margin:5px 0}
.tr select{width:auto;display:inline-block;padding:2px 6px;font-size:13px}
.rg{margin:6px 0}.rg ul{margin:4px 0;padding-left:18px}.rg li{margin:3px 0}
.pill{background:var(--ac);color:var(--acf);border-radius:999px;padding:0 7px;font-size:12px;margin-left:4px}
.empty{color:var(--mut);padding:14px 0}
footer{margin-top:26px}
</style>
</head>

function calc(targets,incl){

  if(!rs||!rs.length||path.length>10||path.indexOf(n)>=0){A.raw[n]=(A.raw[n]||0)+qty;return {n,qty,leaf:1}}
  const r=rs[Math.min(S.pref[n]||0,rs.length-1)],c=Math.ceil(qty/r.out);
  const I=A.inter[n]||(A.inter[n]={q:0,c:0});I.q+=qty;I.c+=c;
  useSt(r.st,r.need);
  return {n,qty,r,c,left:c*r.out-qty,ch:r.in.map(a=>need(a[0],a[1]*c,path.concat(n)))};
 }
 targets.forEach(t=>{
  if(t.t==='i')A.tree.push(need(t.n,t.q||1,[]));
  else if(t.t==='s'){A.sts[t.n]=1;q.push(t.n)}
  else{const L=(t.t==='f'?FL:AL).find(x=>x.lv===t.lv);if(L)L.items.forEach(a=>A.tree.push(need(a[0],a[1],[])))}
 });
 let g=0;

}

}
function usesHtml(n){
 const u=usesOf(n);if(!u.length)return '';
 const L=u.map(x=>x.t==='i'?`${chip(x.n)}<small> (${esc(x.st)})${x.any?' ※'+esc(x.any):''}</small>`:x.t==='s'?`${chip(x.n,0,'st')}<small> 건설${x.any?' ※'+esc(x.any):''}</small>`:`<span class="chip">${x.t==='f'?'화염':'제단'} 레벨 ${x.lv}</span>`);
 return `<h3>쓰이는 곳 <small>(${u.length})</small></h3><div class="chips">${L.slice(0,60).join('')}</div>${u.length>60?'<small>… 외 '+(u.length-60)+'건</small>':''}`;
}
function viewS(){
 const n=S.cur,k=kindOf(n);
 let h=`<div class="top"><button id="back" ${S.hist.length?'':'disabled'}>← 뒤로</button><a href="${urlOf(n)}" target="_blank" rel="noopener">위키에서 보기 ↗</a></div>`;
 h+=`<div class="hd ${clsOf(n)}"><h2>${esc(n)}</h2><span class="tag">${esc(tagOf(n))}</span>${k==='s'?'':star(n)}</div>`;
 if(k==='s')h+=stHtml(n);
 else{h+=`<h3>어디서 얻나요</h3><div class="card">${srcHtml(n)}</div>`+recHtml(n)}
 const can=(k==='s'&&ST[n].cost)||(IT[n]&&IT[n].rec&&IT[n].rec.length);
 if(can){
  const t=k==='s'?{t:'s',n}:{t:'i',n,q:S.q};
  h+=`<h3>${k==='s'?'건설에 필요한 재료 총량':'필요 재료 계산'}</h3><div class="card"><div class="row">${k==='s'?'':`<label>목표 수량 <input id="qty" type="number" min="1" value="${S.q}"></label>`}<label><input type="checkbox" id="incl" ${S.incl?'checked':''}> 작업대 건설 재료도 포함</label><button id="addcur">내 계획에 담기</button></div>${resHtml(calc([t],S.incl))}</div>`;
 }
 return h+usesHtml(n);
}
function viewR(){
 let h='<h3>화염 제단 강화 (화염 레벨)</h3>';
 h+=FL.map(l=>`<div class="card"><div class="ch"><b>화염 레벨 ${l.lv}</b><small>행복한 생존자 ${l.happy}명 · 수용 ${l.cap} · 수원 ${l.water}</small><button data-add="f:${l.lv}">계획에 담기</button></div><div class="chips">${l.items.map(a=>chip(a[0],a[1])).join('')}</div></div>`).join('');
 h+='<h3>제단 레벨 (거점 범위)</h3>'+AL.map(l=>`<div class="card"><div class="ch"><b>제단 레벨 ${l.lv}</b><small>범위 ${esc(l.area)}${l.need?' · 화염 레벨 '+l.need+' 필요':''}</small><button data-add="a:${l.lv}">계획에 담기</button></div><div class="chips">${l.items.map(a=>chip(a[0],a[1])).join('')}</div></div>`).join('');
 h+='<h3>작업대 로드맵 <small>(만드는 생존자별)</small></h3>';
 const by={};Object.keys(ST).forEach(k=>{const s=ST[k];if(s.k==='작업대'&&s.cost)(by[s.npc||s.by||'기타']=by[s.npc||s.by||'기타']||[]).push(k)});
 Object.keys(by).forEach(g=>{h+=`<div class="card tint j-${NJ[g]||'basic'}"><div class="ch"><b>${ICON[NJ[g]||'basic']||''} ${esc(g)}</b></div><div class="chips">${by[g].map(a=>chip(a,0,'st')).join('')}</div></div>`});
 return h;
}
const label=t=>t.t==='i'?`${t.n} ×${t.q}`:t.t==='s'?`${t.n} 건설`:t.t==='f'?`화염 레벨 ${t.lv}`:`제단 레벨 ${t.lv}`;
function viewP(){
 if(!S.plan.length)return '<p class="empty">아직 담은 목표가 없어요. 상세나 테크 로드맵에서 "내 계획에 담기"를 눌러보세요.</p>';
 const A=calc(S.plan,S.incl);
 let h=`<div class="card"><div class="ch"><b>목표 ${S.plan.length}개</b><span><button id="copy">텍스트로 복사</button> <button id="clear">전부 비우기</button></span></div>`+
  S.plan.map((t,i)=>`<div class="row">${t.t==='i'?`<input type="number" min="1" value="${t.q}" data-pq="${i}" aria-label="수량" style="width:84px">`:''}<span>${esc(label(t))}</span><button data-del="${i}" aria-label="삭제">삭제</button></div>`).join('')+
  `<label class="note"><input type="checkbox" id="incl" ${S.incl?'checked':''}> 작업대 건설 재료도 포함</label></div>`;
 return h+resHtml(A)+`<textarea id="cp" readonly style="display:none;width:100%;height:150px;margin-top:10px"></textarea>`;
}
function planText(){
 const A=calc(S.plan,S.incl),L=['[목표] '+S.plan.map(label).join(', '),''];
 const G={};Object.entries(A.raw).forEach(([n,q])=>{(G[regionOf(n)]=G[regionOf(n)]||[]).push(n+' ×'+q)});
 REGIONS.concat(Object.keys(G).filter(k=>REGIONS.indexOf(k)<0)).forEach(r=>{if(G[r])L.push('▶ '+r+': '+G[r].join(', '))});
 const s=Object.keys(A.sts);if(s.length)L.push('','[필요 작업대] '+s.join(', '));return L.join('\n');
}
function render(){
 document.querySelectorAll('.tabs button').forEach(b=>b.setAttribute('aria-pressed',b.dataset.tab===S.tab));
 $('main').innerHTML=S.tab==='s'?viewS():S.tab==='r'?viewR():viewP();
 const pc=$('pc');pc.hidden=!S.plan.length;pc.textContent=S.plan.length;save();refreshFav();
}
function go(n){if(!n)return;if(n!==S.cur||S.tab!=='s'){if(S.cur&&n!==S.cur)S.hist.push(S.cur);S.cur=n;S.q=1}S.tab='s';$('sug').style.display='none';$('q').value='';render();try{window.scrollTo(0,0)}catch(e){}}
function toggleFav(n){const i=S.fav.indexOf(n);if(i>=0)S.fav.splice(i,1);else S.fav.unshift(n);save();refreshFav()}
function refreshFav(){
 $('favs').innerHTML=S.fav.length?`<span class="fl">★ 즐겨찾기</span>`+S.fav.map(n=>chip(n)).join(''):'';
 document.querySelectorAll('[data-fav]').forEach(b=>{const f=isFav(b.dataset.fav);b.textContent=f?'★':'☆';b.setAttribute('aria-pressed',f)});
 const bx=$('sug');if(bx.style.display==='block')sug($('q').value);
}
const sRow=x=>`<div class="srow"><button data-go="${esc(x[0])}"><span><i class="sw ${clsOf(x[0])}"></i>${esc(x[0])}</span><small>${tagOf(x[0])}${x[2]?'':' · 위키 링크'}</small></button>${x[1]==='s'?'':star(x[0])}</div>`;
function sug(v0){
 const box=$('sug'),v=v0.replace(/\s/g,'').toLowerCase(),nm=x=>x[0].replace(/\s/g,'').toLowerCase();
 let h='';const shown=new Set();
 const grp=(t,names)=>{const L=names.filter(n=>NMI[n]&&!shown.has(n));if(!L.length)return '';L.forEach(n=>shown.add(n));return `<div class="sh2">${esc(t)} (${L.length})</div>`+L.map(n=>sRow(NMI[n])).join('')};
 if(!v){
  const f=S.fav.map(n=>NMI[n]).filter(Boolean);
  if(!f.length){box.style.display='none';return}
  h='<div class="sh">★ 즐겨찾기</div>'+f.map(sRow).join('');
 }else{
  const ex=NM.find(x=>nm(x)===v);
  if(v==='생존자')h+=grp('생존자',survivors());
  else if(ex){
   shown.add(ex[0]);h+=sRow(ex);
   const n=ex[0],s=ST[n];
   if(s&&!IT[n]){
    if(s.k==='생존자'){h+=grp(n+' 작업대',stationsOf(n));h+=grp(n+' 직접 제작 아이템',makesOf(n))}
    else h+=grp(n+' 제작 아이템',makesOf(n));
   }
  }
  const m=NM.filter(x=>!shown.has(x[0])&&nm(x).indexOf(v)>=0).sort((a,b)=>{const fa=isFav(a[0])?0:1,fb=isFav(b[0])?0:1;if(fa!==fb)return fa-fb;const sa=nm(a).indexOf(v)===0?0:1,sb=nm(b).indexOf(v)===0?0:1;return sa-sb||b[2]-a[2]||a[0].length-b[0].length}).slice(0,40);
  if(m.length&&h)h+='<div class="sh2">이름이 비슷한 항목</div>';
  h+=m.map(sRow).join('');
  if(!h)h='<div class="empty" style="padding:10px 12px">검색 결과가 없어요.</div>';
 }
 box.innerHTML=h;box.style.display='block';
}
document.addEventListener('click',e=>{
 const t=e.target;if(!t.closest)return;
 const b=t.closest('[data-go],[data-fav],[data-tab],[data-add],[data-del],#back,#addcur,#copy,#clear');
 if(!b){if(!t.closest('.sbox'))$('sug').style.display='none';return}
 if(b.dataset.fav!==undefined){toggleFav(b.dataset.fav);return}
 if(b.dataset.go)go(b.dataset.go);
 else if(b.dataset.tab){S.tab=b.dataset.tab;render()}
 else if(b.dataset.add){const[a,l]=b.dataset.add.split(':');S.plan.push({t:a,lv:+l});render()}
 else if(b.dataset.del!==undefined){S.plan.splice(+b.dataset.del,1);render()}
 else if(b.id==='back'){S.cur=S.hist.pop()||S.cur;S.q=1;render()}
 else if(b.id==='addcur'){const n=S.cur,k=kindOf(n),x=S.plan.find(p=>(k==='s'?p.t==='s':p.t==='i')&&p.n===n);if(x&&x.t==='i')x.q+=S.q;else if(!x)S.plan.push(k==='s'?{t:'s',n}:{t:'i',n,q:S.q});render()}
 else if(b.id==='clear'){S.plan=[];render()}
 else if(b.id==='copy'){const c=$('cp'),tx=planText();c.style.display='block';c.value=tx;c.select();try{navigator.clipboard.writeText(tx)}catch(er){}}
});
document.addEventListener('focusin',e=>{if(e.target&&e.target.id==='q')sug(e.target.value)});
document.addEventListener('input',e=>{
 const t=e.target;
 if(t.id==='q')sug(t.value);
 else if(t.id==='qty'){S.q=Math.max(1,parseInt(t.value)||1);const k=kindOf(S.cur);const card=t.closest('.card');if(card){const A=calc([{t:'i',n:S.cur,q:S.q}],S.incl);card.querySelectorAll('h4,.rg,.tr,.rc,.empty,.chips').forEach(x=>{if(!x.closest('.row'))x.remove()});card.insertAdjacentHTML('beforeend',resHtml(A))}save()}
 else if(t.dataset&&t.dataset.pq!==undefined){const p=S.plan[+t.dataset.pq];if(p){p.q=Math.max(1,parseInt(t.value)||1);const keep=t.dataset.pq;render();const n=document.querySelector('[data-pq="'+keep+'"]');if(n){n.focus();try{n.setSelectionRange(n.value.length,n.value.length)}catch(er){}}}}
});
document.addEventListener('change',e=>{
 const t=e.target;
 if(t.id==='incl'){S.incl=t.checked;render()}
 else if(t.dataset&&t.dataset.pref){S.pref[t.dataset.pref]=+t.value;render()}
});
const withData=NM.filter(x=>x[2]).length;
$('foot').innerHTML=`상세 데이터가 있는 항목 ${withData}개 / 이름 색인 ${NM.length}개 (데이터가 없는 항목은 위키 링크만 제공해요). 출처: GameWith 한국어 위키(재료 획득처, 화염 제단, 작업대), AllThings.How(1.0 가공 작업대 레시피·재료 지역표). 패치로 바뀔 수 있고 일부 값은 총 재료에서 역산했어요.`;
$('leg').innerHTML=`<div class="lrow"><span class="chip c-surv">🧑 생존자 (모든 직업 공통)</span><span class="chip c-raw">채집·획득 재료</span><span class="chip c-grp">대체 가능 재료</span></div>`+JOBS.map(j=>`<div class="lrow"><span class="chip c-st j-${j[0]}">${j[2]} ${j[1]} 작업대</span><span class="chip c-mt j-${j[0]}">${j[1]} 제작 재료</span></div>`).join('');
render();
/*TEST*/
})();
</script>
</body>
</html>
